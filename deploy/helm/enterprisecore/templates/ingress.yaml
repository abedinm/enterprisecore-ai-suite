{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprisecore.fullname" . }}
  labels:
    {{- include "enterprisecore.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Backend-served paths first; nginx ingress matches in order.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "enterprisecore.backend.fullname" . }}
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /site
            pathType: Prefix
            backend:
              service:
                name: {{ include "enterprisecore.backend.fullname" . }}
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /widget.js
            pathType: Exact
            backend:
              service:
                name: {{ include "enterprisecore.backend.fullname" . }}
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "enterprisecore.backend.fullname" . }}
                port:
                  number: {{ .Values.service.backend.port }}
          # SPA last — catch-all.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "enterprisecore.frontend.fullname" . }}
                port:
                  number: {{ .Values.service.frontend.port }}
{{- end }}
