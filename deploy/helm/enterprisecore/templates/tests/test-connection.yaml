apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "enterprisecore.fullname" . }}-test-connection"
  labels:
    {{- include "enterprisecore.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          echo "Testing backend health"
          curl -sf http://{{ include "enterprisecore.backend.fullname" . }}:{{ .Values.service.backend.port }}/api/health
          echo
          echo "Testing frontend"
          curl -sf http://{{ include "enterprisecore.frontend.fullname" . }}:{{ .Values.service.frontend.port }}/healthz
          echo
          echo "All probes OK"
