{{- if not .Values.secrets.existingSecret }}
{{- /*
   Generate secrets on first install. We use lookup() to preserve values on
   upgrade so re-running `helm upgrade` doesn't rotate the SECRET_KEY out
   from under existing user sessions. Override in values.yaml to set
   explicit values.
*/ -}}
{{- $secretName := printf "%s-secrets" (include "enterprisecore.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data -}}
{{- end -}}

{{- $secretKey := .Values.secrets.secretKey | default (index $existingData "SECRET_KEY" | default (randAlphaNum 64 | b64enc) | b64dec) -}}
{{- $encryptionKey := .Values.secrets.encryptionKey | default (index $existingData "ENCRYPTION_KEY" | default (randAlphaNum 64 | b64enc) | b64dec) -}}
{{- $postgresPassword := .Values.postgres.password | default (index $existingData "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) | b64dec) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "enterprisecore.labels" . | nindent 4 }}
  annotations:
    # Marks this secret as managed by the chart but safe to keep on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | quote }}
  {{- end }}
{{- end }}
{{- if and (eq (.Values.secrets.secretKey | default "") "") (not .Values.secrets.existingSecret) }}
---
# NOTE: SECRET_KEY auto-generated. To set explicitly, pass
# --set secrets.secretKey=...  or use --set secrets.existingSecret=...
{{- end }}
