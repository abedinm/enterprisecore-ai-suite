apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprisecore.frontend.fullname" . }}
  labels:
    {{- include "enterprisecore.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  {{- with .Values.service.frontend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "enterprisecore.frontend.selectorLabels" . | nindent 4 }}
