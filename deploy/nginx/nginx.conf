# EnterpriseCore AI Suite — nginx config (frontend container)
# Serves the SPA at /, proxies API/site/widget/metrics to the backend.

upstream ec_backend {
    # Backend service name as resolved by Docker/K8s service discovery.
    # Override in k8s by templating this file via ConfigMap if your service
    # name differs.
    server backend:8765;
    keepalive 16;
}

# Limit request body size — uploads to /api/knowledge or /api/files can be
# large (default 100 MB matches knowledge_max_upload_mb).
client_max_body_size 100m;

# Gzip — applied to JSON, JS, CSS, SVG, HTML. PNG/JPG already compressed.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/xml
    application/x-yaml
    image/svg+xml
    text/css
    text/html
    text/plain
    text/xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for orchestrators (k8s liveness/readiness, ALB target
    # group) — keeps them off the SPA's index.html which is cheap but
    # noisier to log.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Backend pass-through. Order matters: more specific locations win, so
    # /metrics and /widget.js are matched here before the SPA catch-all.
    location ~ ^/(api|site|widget\.js|metrics)(?:/|$) {
        proxy_pass http://ec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE streaming endpoints (e.g. /api/v1/ai/stream): disable buffering
        # and bump the read timeout. The AI providers sometimes hold the
        # connection idle while a model warms up.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache hashed Vite assets aggressively. The file names contain a content
    # hash so they're safe to cache forever.
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache; it's how the browser discovers new hashed
    # bundle names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback. HashRouter works without this, but BrowserRouter (and
    # any future deep-linking) does. Cheap to keep.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version
    server_tokens off;
}
