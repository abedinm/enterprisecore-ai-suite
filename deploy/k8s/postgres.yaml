apiVersion: v1
kind: Service
metadata:
  name: enterprisecore-postgres
  labels:
    app.kubernetes.io/name: enterprisecore
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: enterprisecore
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: enterprisecore-postgres
  labels:
    app.kubernetes.io/name: enterprisecore
    app.kubernetes.io/component: postgres
spec:
  serviceName: enterprisecore-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprisecore
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprisecore
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: enterprisecore
            - name: POSTGRES_USER
              value: ec
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprisecore-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ec", "-d", "enterprisecore"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ec", "-d", "enterprisecore"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
