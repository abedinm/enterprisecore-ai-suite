apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprisecore-config
  labels:
    app.kubernetes.io/name: enterprisecore
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8765"
