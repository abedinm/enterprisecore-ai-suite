apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprisecore-backend
  labels:
    app.kubernetes.io/name: enterprisecore
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprisecore
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprisecore-frontend
  labels:
    app.kubernetes.io/name: enterprisecore
    app.kubernetes.io/component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprisecore
      app.kubernetes.io/component: frontend
