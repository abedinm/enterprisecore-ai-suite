# Example secret. DO NOT commit a populated copy. Use one of:
#   kubectl create secret generic enterprisecore-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 48 | tr -d '\n')" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')" \
#     --from-literal=POSTGRES_DSN="postgresql+psycopg2://ec:$(openssl rand -base64 24 | tr -d '\n')@enterprisecore-postgres:5432/enterprisecore" \
#     --from-literal=ANTHROPIC_API_KEY="..." \
#     -n enterprisecore
#
# Or use Sealed Secrets / External Secrets / SOPS for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: enterprisecore-secrets
  labels:
    app.kubernetes.io/name: enterprisecore
type: Opaque
stringData:
  SECRET_KEY: "REPLACE-ME"
  ENCRYPTION_KEY: "REPLACE-ME"
  POSTGRES_PASSWORD: "REPLACE-ME"
  POSTGRES_DSN: "postgresql+psycopg2://ec:REPLACE-ME@enterprisecore-postgres:5432/enterprisecore"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  SENTRY_DSN: ""
