name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Export OpenAPI schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot uvicorn and dump /openapi.json
        working-directory: backend
        env:
          SECRET_KEY: ci-docs-only-not-secret
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          UVICORN_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/openapi.json > /tmp/openapi.json; then
              echo "openapi.json fetched"
              break
            fi
            sleep 1
          done
          kill $UVICORN_PID || true
          mkdir -p ../docs
          if [ -s /tmp/openapi.json ]; then
            mv /tmp/openapi.json ../docs/openapi.json
          else
            echo "Failed to fetch openapi.json" >&2
            exit 1
          fi

      - name: Upload openapi.json
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: docs/openapi.json
          if-no-files-found: error

  mkdocs:
    name: Build mkdocs site (if configured)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Check for mkdocs.yml
        id: check
        run: |
          if [ -f mkdocs.yml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mkdocs.yml not present. To enable docs site, add mkdocs.yml + docs/ pages and re-run."
          fi

      - name: Set up Python 3.13
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install mkdocs
        if: steps.check.outputs.exists == 'true'
        run: pip install mkdocs mkdocs-material

      - name: Build site
        if: steps.check.outputs.exists == 'true'
        run: mkdocs build --strict

      - name: Upload site
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
